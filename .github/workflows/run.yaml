
name: Iris Model Training CICD

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  model-training:
    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Verify project files
      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -lah

          test -f iris.csv
          test -f requirements.txt
          test -f train_model.py

      # 4. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # 5. Install Python libraries
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Train machine learning models
      - name: Run model training
        run: |
          echo "Starting Iris ML training..."
          python -u train_model.py

      # 7. Check and display model scores
      - name: Display model scores
        run: |
          echo "======================================"
          echo "       IRIS MODEL PERFORMANCE"
          echo "======================================"

          if [ ! -s scores.txt ]; then
            echo "ERROR: scores.txt is missing or empty!"
            exit 1
          fi

          echo ""
          echo "MODEL SCORES:"
          cat scores.txt

          echo ""
          echo "======================================"

      # 8. Display scores in GitHub Summary
      - name: Publish scores in GitHub Summary
        run: |
          echo "# Iris ML Model Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Model Accuracy Scores" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat scores.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "## Generated Output Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh scores.txt ConfusionMatrix.png FeatureImportance.png \
            >> $GITHUB_STEP_SUMMARY

      # 9. Verify generated graphs
      - name: Verify generated files
        run: |
          test -f ConfusionMatrix.png
          test -f FeatureImportance.png
          echo "All graph files generated successfully."

      # 10. Generate combined report
      - name: Generate ML report
        run: |
          echo "# Iris Dataset - Model Training Report" > report.md

          echo "## Model Scores" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "![](./ConfusionMatrix.png)" >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "![](./FeatureImportance.png)" >> report.md

      # 11. Publish CML report on Pull Request
      - name: Publish CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

      # 12. Upload results
      - name: Upload ML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-ML-Training-Results
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
            report.md
          if-no-files-found: warn
          retention-days: 7
